[package]
name = "xiaohong-perception"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Traceable board-photo perception core for OpenHarmony"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ocrs-backend = ["dep:ocrs", "dep:rten"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ocrs = { version = "0.14.0", optional = true, default-features = false, features = ["onnx"] }
rten = { version = "0.28.0", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
